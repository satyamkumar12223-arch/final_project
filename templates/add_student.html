{% extends 'layout.html' %}{% block title %}Add student{% endblock %}
{% block content %}
<div class="form-page"><a class="back-link" href="{{ url_for('dashboard') }}">← Back to students</a><section class="form-card"><div class="form-card-icon">＋</div><div class="eyebrow"><span class="eyebrow-dot"></span> NEW RECORD</div><h1>Add a student</h1><p class="muted">Enter the details below. Marks and attendance can be added later.</p><form method="post" class="form-stack student-form"><label for="name">Student name <span class="required">*</span></label><input id="name" name="name" placeholder="e.g. Jordan Lee" maxlength="100" required autofocus><label for="roll_number">Roll number <span class="required">*</span></label><input id="roll_number" name="roll_number" placeholder="e.g. STU-2025-014" maxlength="30" required><div class="field-row"><div><label for="marks">Marks <span class="optional">OPTIONAL</span></label><div class="input-suffix"><input id="marks" name="marks" type="number" min="0" max="100" step="0.01" placeholder="—"><span>/ 100</span></div></div><div><label for="attendance">Attendance <span class="optional">OPTIONAL</span></label><div class="input-suffix"><input id="attendance" name="attendance" type="number" min="0" max="100" step="0.01" placeholder="—"><span>%</span></div></div></div><div class="form-actions"><a class="button button-quiet" href="{{ url_for('dashboard') }}">Cancel</a><button class="button" type="submit">Save student <span>→</span></button></div></form></section></div>
{% endblock %}
